    height: *VJG_Other
    horizontal_gap: *NJL
    vertical_gap: *NJH
    key_text_offset_y: *DtextY
    key_symbol_offset_y: *DsymY
    key_press_offset_x: 0
    key_press_offset_y: 8
    key_symbol_offset_x: *DsymX
    width: 17.5
    keys:
      # 第一行
      - {click: "sin(){Left}", swipe_up: "asin(){Left}", swipe_down: "rad(){Left}", width: 15, key_text_size: 20}
      - {click: "+", width: 15}
      - {click: "1", swipe_up: "random(1,33)", swipe_down: "random(1,16)", key_text_color: 0xff5F97F6}
      - {click: "2", swipe_up: "e", swipe_down: "sqrt(){Left}", key_text_color: 0xff5F97F6}
      - {click: "3", swipe_up: "pi", key_text_color: 0xff5F97F6}
      - {click: Keyboard_default, composing: Escape, key_text_size: 20}
      # 第二行
      - {click: "cos(){Left}", swipe_up: "acos(){Left}", swipe_down: "deg(){Left}", width: 15, key_text_size: 20}
      - {click: "-", width: 15}
      - {click: "4", key_text_color: 0xff5F97F6}
      - {click: "5", swipe_left: ">", swipe_right: "<", key_text_color: 0xff5F97F6}
      - {click: "6", key_text_color: 0xff5F97F6}
      - {click: "=", swipe_up: "random(1,35)", swipe_down: "random(1,12)", swipe_left: "random(){Left}"}
      # 第三行
      - {click: "tan(){Left}", swipe_up: "atan(){Left}", width: 15, key_text_size: 20}
      - {click: "*", width: 15, swipe_up: "^", swipe_down: "fac(){Left}"}
      - {click: "7", key_text_color: 0xff5F97F6}
      - {click: "8", key_text_color: 0xff5F97F6}
      - {click: "9", key_text_color: 0xff5F97F6}
      - {click: BackSpace, swipe_left: ClearH_Ch, swipe_up: Clear}
      # 第四行
      - {click: "log(){Left}", swipe_up: "ln(){Left}", width: 15, key_text_size: 20}
      - {click: "/", width: 15, swipe_up: "%", swipe_down: "mod(){Left}"}
      - {click: ",", swipe_up: "(){Left}", swipe_left: Left, swipe_right: Right}
      - {click: "0", swipe_up: space, swipe_left: Left, swipe_right: Right, key_text_color: 0xff5F97F6}
      - {click: ".", swipe_up: "{}{Left}", swipe_left: Left, swipe_right: Right}
      - {click: Return, key_back_color: 0xff5F97F6, key_text_size: 20}
      # 底部抬高行
      - {click: space2, swipe_left: Left, swipe_right: Right, height: *DG, width: 100}

