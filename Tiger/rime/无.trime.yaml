# Trime default style settings
# encoding: utf-8

config_version: "2.0"
name: 无
author: 无
description: 无

# =============================================================================
# 全局布局与尺寸变量 (Anchors)
# =============================================================================

# 键盘候选栏设置
candidate_setting:
  height: &HXG 26                # 候选区高度
  spacing: &HXJJ 12              # 候选间距
  text_size: &HXZH 20            # 候选字号
  round_corner: &HXYJ 30         # 候选圆角
  view_height: &HXGD 26          # 候选高
  comment_height: &BMGD 15       # 编码高
  comment_text_size: &BMZH 13    # 编码字体大小

# 键盘高度与文字偏移调整
keyboard_height:
  main_height: &VJG 56           # 主辅键盘键高
  main_last_height: &VJM 56      # 主辅键盘末行键高
  symbol_height: &FJG 56         # 符号键盘键高
  sym_offset_y: &DsymY 0.5       # 主键盘上档文字纵向位置调节（负数上移）
  sym_offset_x: &DsymX 0         # 主键盘上档文字横向位置调节（负数左移）
  text_offset_y: &DtextY 0       # 主键盘字母纵向位置调节
  other_height: &VJG_Other 56    # 其他键盘高度
  num_sym_width: &NUM_SYM_W 15.5 # 数字/符号键盘宽度
  bottom_gap: &DG 38             # 底部抬高键盘高度

# 键盘内部间距与圆角结构
other:
  # 主键盘结构（四行）
  main_row_gap: &VJH 11          # 主键盘行距
  main_col_gap: &VJL 3.3         # 主键盘列距
  main_round_corner: &VJY 30     # 主键盘圆角
  
  # 符号键盘结构（五行）
  sym_row_gap: &FJH 2            # 符号键盘行距
  sym_col_gap: &FJL 2            # 符号键盘列距
  sym_round_corner: &FJY 30      # 符号键盘圆角
  
  # 数字键盘结构（四行）
  num_row_gap: &NJH 6            # 数字键盘行距
  num_col_gap: &NJL 6            # 数字键盘列距
  num_round_corner: &NJY 30      # 数字键盘圆角

# 基础颜色定义
colors:
  black: &BLACK 0xff000000       # 纯黑

# =============================================================================
# 界面风格与功能开关 (Style)
# =============================================================================
style:
  auto_caps: false               # 自動句首大寫: true|false|ascii
  background_dim_amount: 0.5
  root_background: keyboard_back_color # 整个键盘区+候选栏的背景图/色
  
  # 字体配置
  candidate_font: TH-Feon.ttf
  comment_font: LXGWWenKaiGBScreenR.ttf
  key_font: LXGWWenKaiGBScreenR.ttf
  label_font: LXGWWenKaiGBScreenR.ttf
  latin_font: LXGWWenKaiGBScreenR.ttf
  symbol_font: LXGWWenKaiGBScreenR.ttf
  text_font: LXGWWenKaiGBScreenR.ttf
  preview_font: LXGWWenKaiGBScreenR.ttf
  hanb_font: TH-Feon.ttf         # 扩充字型 (已去重，保留原最后生效项)
  
  # 候选栏细节
  candidate_hide_button: 🐯
  candidate_padding: 2.5
  candidate_spacing: *HXJJ
  candidate_text_size: *HXZH
  candidate_use_cursor: true
  candidate_round_corner: 30
  candidate_view_height: *HXGD
  comment_height: *BMGD
  comment_on_top: true
  comment_text_size: *BMZH
  
  # 键盘键位与提示
  key_height: *FJG
  key_width: 10.0
  key_text_size: 22
  key_long_text_size: 15
  label_text_size: 22
  symbol_text_size: 10
  text_size: 14
  preview_height: 56
  preview_offset: -32
  preview_text_size: 40
  
  # 布局响应与微调
  color_scheme: default
  horizontal: true
  horizontal_gap: *NJH
  vertical_gap: *NJL
  round_corner: *NJY
  shadow_radius: 0
  proximity_correction: true
  vertical_correction: -5
  reset_ascii_mode: false
  latin_locale: en_US
  locale: zh_CN
  speech_opencc_config: none
  keyboards: [.default, default, .last_lock, number]
  
  # 候选窗口悬浮控制
  layout:
    position: fixed
    min_length: 1
    max_length: 4
    sticky_lines: 4
    max_entries: 0
    border: 0
    max_width: 360
    max_height: 300
    min_width: 0
    min_height: 55
    margin_x: 5
    margin_y: 5
    line_spacing: 0
    line_spacing_multiplier: 1.2
    spacing: 0.5
    round_corner: *HXYJ
    alpha: 0xdd
    elevation: 0
    movable: false
    all_phrases: false

  window:
    - {start: "", composition: "%s", end: "✍", letter_spacing: 0.1}
    - {start: "\n", label: "%s.", candidate: "%s", comment: " %s", end: "", sep: "  "}

# =============================================================================
# 颜色回退机制 (Fallback Colors)
# =============================================================================
fallback_colors:
  candidate_text_color: text_color
  comment_text_color: candidate_text_color
  border_color: back_color
  candidate_separator_color: border_color
  hilited_text_color: text_color
  hilited_back_color: back_color
  hilited_candidate_text_color: hilited_text_color
  hilited_candidate_back_color: hilited_back_color
  hilited_comment_text_color: hilited_text_color
  hilited_key_back_color: hilited_candidate_back_color
  hilited_key_text_color: hilited_candidate_text_color
  hilited_key_symbol_color: hilited_comment_text_color
  hilited_off_key_back_color: hilited_key_back_color
  hilited_on_key_back_color: hilited_key_back_color
  hilited_off_key_text_color: hilited_key_text_color
  hilited_on_key_text_color: hilited_key_text_color
  key_back_color: back_color
  key_border_color: border_color
  key_text_color: candidate_text_color
  key_symbol_color: comment_text_color
  label_color: candidate_text_color
  off_key_back_color: key_back_color
  off_key_text_color: key_text_color
  on_key_back_color: hilited_key_back_color
  on_key_text_color: hilited_key_text_color
  preview_back_color: key_text_color
  preview_text_color: key_back_color
  shadow_color: border_color
  root_background: back_color
  candidate_background: back_color
  keyboard_back_color: border_color
  text_back_color: back_color
  long_text_back_color: key_back_color

# =============================================================================
# 主题配色方案 (Color Schemes)
# =============================================================================
preset_color_schemes:
  default:
    name: 无
    author: 无
    text_color: 0xff5F97F6
    candidate_separator_color: 0x00
    back_color: 0xff212E4D
    border_color: 0xff212E4D
    label_color: 0xD6F5F5
    hilited_text_color: 0xff5F97F6
    hilited_back_color: 0x00
    comment_text_color: 0xD6F5F5
    hilited_candidate_text_color: 0xff5F97F6
    hilited_candidate_back_color: 0x00
    candidate_text_color: 0xD6F5F5
    candidate_back_color: 0x00
    key_back_color: 0xff385183
    key_text_color: 0xffD6F5F5
    preview_back_color: 0xff5F97F6 
    preview_text_color: 0xffD6F5F5

  # 新增：蓝墨幽邃风格主题（像素级参考自 Cloudflare 三方 IP 扫描器 UI）
  ink_blue:
    name: "蓝墨幽邃"
    author: "AI"
    text_color: 0xff2563EB
    candidate_separator_color: 0x00
    back_color: 0xff161F30              # 核心卡片底色：高级墨蓝，保证暗而不死黑
    border_color: 0xff0B0F19            # 间距与外轮廓底色：最深层的墨底，拉开立体感
    label_color: 0xff8CA2C0             # 辅助标签色：对应图中“IP 版本”等低饱和度蓝灰
    hilited_text_color: 0xff2563EB
    hilited_back_color: 0x00
    comment_text_color: 0xff7185A3      # 拼音编码提示：中等明度的蓝灰，不喧宾夺主
    candidate_text_color: 0xffC8D6EC     # 未选中候选字：柔和的冰川蓝灰，看久了不累眼
    candidate_back_color: 0x00
    hilited_candidate_text_color: 0xffFFFFFF # 高亮候选字：纯白
    hilited_candidate_back_color: 0xff2563EB # 核心高亮色：提取自“开始扫描”按钮的科技亮蓝，极度醒目
    key_back_color: 0xff232E42          # 按键背景色：对应图中输入框的浅暗蓝，与键盘底色完美融合
    key_text_color: 0xffD1DCEB          # 按键主字母：明亮的浅蓝灰
    preview_back_color: 0xff2563EB      # 按键弹窗气泡：跟随核心科技蓝
    preview_text_color: 0xffFFFFFF      # 按键弹窗文字：纯白

  # 新增：明亮科技蓝风格（高明度、轻盈多色层、极富现代科技质感）
  tech_bright_blue:
    name: "明亮科技蓝"
    author: "AI"
    text_color: 0xff1E40AF
    candidate_separator_color: 0x00
    back_color: 0xffE8F1FC              # 键盘大背景：极轻盈的剔透淡蓝，奠定整体明亮干净的基调
    border_color: 0xffD4E4F7            # 间距与分割：略深一阶的冰川蓝，勾勒出细腻的模块线条
    label_color: 0xff627D98             # 辅助标签色：中性调蓝灰，让主键盘的上档符号低调且清晰
    hilited_text_color: 0xff1E40AF
    hilited_back_color: 0x00
    comment_text_color: 0xff627D98      # 编码提示区：柔和的灰蓝色，清爽不杂乱
    candidate_text_color: 0xff102A43     # 未选中候选字：深邃的邃蓝色，保证在亮色底色下极高的辨识度
    candidate_back_color: 0x00
    hilited_candidate_text_color: 0xffFFFFFF # 高亮候选字：纯白
    hilited_candidate_back_color: 0xff2563EB # 核心高亮：极具科技跃动感的明亮纯蓝，点睛之笔
    key_back_color: 0xffFFFFFF          # 按键背景：纯白按键。在淡蓝大背景烘托下，极具实体键盘的悬浮立体感
    key_text_color: 0xff102A43          # 按键字母：高对比度的深邃蓝黑，字迹清晰锐利
    preview_back_color: 0xff2563EB      # 按键弹窗气泡：跟随核心科技明蓝
    preview_text_color: 0xffFFFFFF      # 按键弹窗文字：纯白

  # 新增：高级质感墨蓝（保留暗色高级感，调高蓝色纯度与明度，拒绝死黑）
  premium_ink_blue:
    name: "高级质感墨蓝"
    author: "AI"
    text_color: 0xff3B82F6
    candidate_separator_color: 0x00
    back_color: 0xff1A263F              # 键盘大背景：纯正的深邃暮蓝，蓝色调显著，绝不发黑发灰
    border_color: 0xff121B2E            # 缝隙与边界：更深一阶的藏青，用来沉淀整体质感
    label_color: 0xff8FAED6             # 辅助标签色：优雅的冰川灰蓝，让上档键符号清晰且高级
    hilited_text_color: 0xff3B82F6
    hilited_back_color: 0x00
    comment_text_color: 0xff7DA2D1      # 编码提示区：清透的中明度蓝，视觉上非常舒服
    candidate_text_color: 0xffF0F5FF     # 未选中候选字：高亮度的极光白蓝，在墨蓝底色上锐利吸睛
    candidate_back_color: 0x00
    hilited_candidate_text_color: 0xffFFFFFF # 高亮候选字：纯白
    hilited_candidate_back_color: 0xff3B82F6 # 核心高亮：选用饱和度更高、更明亮的激光科技蓝，一秒拉出科技感
    key_back_color: 0xff2B3B5C          # 按键背景：这是提亮的关键！比大背景高出几个亮度的微光蓝，让按键极具立体悬浮质感
    key_text_color: 0xffE2EDFD          # 按键主字母：带有蓝色灵魂的清透白，字迹极其清晰
    preview_back_color: 0xff3B82F6      # 按键弹窗气泡：跟随明亮科技蓝
    preview_text_color: 0xffFFFFFF      # 按键弹窗文字：纯白

  # 新增：耀动墨蓝（在暗色质感中注入空气感与高明度，彻底告别黑沉）
  vibrant_ink_blue:
    name: "耀动墨蓝"
    author: "AI"
    text_color: 0xff3B82F6
    candidate_separator_color: 0x00
    back_color: 0xff253557              # 键盘大背景：提升了明度的明朗深海蓝，有明显的蓝色基调，绝不发黑
    border_color: 0xff1A253E            # 缝隙与边界：沉淀质感的藏青，让结构线依然清晰紧凑
    label_color: 0xffA3BFFA             # 辅助标签色：明亮的淡薰衣草蓝，让上档键符号极其清晰
    hilited_text_color: 0xff3B82F6
    hilited_back_color: 0x00
    comment_text_color: 0xff93C5FD      # 编码提示区：通透的天空蓝，视觉上非常轻盈灵动
    candidate_text_color: 0xffF1F5F9     # 未选中候选字：高亮奶白色，在蓝底上对比度极高，看字不费劲
    candidate_back_color: 0x00
    hilited_candidate_text_color: 0xffFFFFFF # 高亮候选字：纯白
    hilited_candidate_back_color: 0xff3B82F6 # 核心高亮：极为纯正、富有跃动感的科技明蓝
    key_back_color: 0xff3D5480          # 按键背景【提亮核心】：大幅提升明度的石青蓝，让按键拥有半实体半微光的通透质感
    key_text_color: 0xffECF3FE          # 按键主字母：带有清透蓝意的冰川白，字迹极其锐利干净
    preview_back_color: 0xff3B82F6      # 按键弹窗气泡：跟随科技明蓝
    preview_text_color: 0xffFFFFFF      # 按键弹窗文字：纯白

  # 新增：精炼质感墨蓝（底色通透不黑沉，按键浓郁不苍白，极具高档墨水质感）
  refined_ink_blue:
    name: "精炼质感墨蓝"
    author: "AI"
    text_color: 0xff3B82F6
    candidate_separator_color: 0x00
    back_color: 0xff2B3E6B              # 键盘大背景【提亮】：饱满通透的暮光墨蓝，蓝色基调浓郁，绝不黑沉
    border_color: 0xff1E2C4D            # 缝隙与边界：内敛的深藏青，用于勾勒按键的立体轮廓
    label_color: 0xff93C5FD             # 辅助标签色：清透的天空蓝，让上档键符号清晰、高级
    hilited_text_color: 0xff3B82F6
    hilited_back_color: 0x00
    comment_text_color: 0xffA3BFFA      # 编码提示区：柔和的淡薰衣草蓝
    candidate_text_color: 0xffF1F5F9     # 未选中候选字：高亮奶白色，在墨蓝底色上极为锐利吸睛
    candidate_back_color: 0x00
    hilited_candidate_text_color: 0xffFFFFFF # 高亮候选字：纯白
    hilited_candidate_back_color: 0xff3B82F6 # 核心高亮：选用最纯正的科技跃动蓝，一秒拉出精致感
    key_back_color: 0xff3D5994          # 按键背景【去苍白】：调高纯度的萨克森蓝，色泽浓郁稳重，极具实体质感
    key_text_color: 0xffEBF3FF          # 按键主字母：融入了冰蓝意象的高亮白，字迹极其干净锐利
    preview_back_color: 0xff3B82F6      # 按键弹窗气泡：跟随科技明蓝
    preview_text_color: 0xffFFFFFF      # 按键弹窗文字：纯白

  # 新增：春日序曲风格（清新明亮、新芽绿与樱花粉交织，极具空气感与呼吸感）
  spring_overture:
    name: "春日序曲"
    author: "AI"
    text_color: 0xff22C55E              # 主文本色：生机新芽绿
    candidate_separator_color: 0x00
    back_color: 0xffF0F7F4              # 键盘大背景：极其清透的薄荷微风绿，奠定春日清晨的明亮基调
    border_color: 0xffE0EDE7            # 缝隙与边界：略深一阶的溪水绿，细腻勾勒出按键轮廓
    label_color: 0xff6B8A7A             # 辅助标签色：温润的苔绿，让上档键符号清晰且不刺眼
    hilited_text_color: 0xff22C55E
    hilited_back_color: 0x00
    comment_text_color: 0xff8FA89B      # 编码提示区：清爽的草木蓝绿
    candidate_text_color: 0xff1E3A2F     # 未选中候选字：深邃的森林暗绿，确保在亮色底上有绝佳辨识度
    candidate_back_color: 0x00
    hilited_candidate_text_color: 0xffFFFFFF # 高亮候选字：纯白
    hilited_candidate_back_color: 0xffFF9AA2 # 核心高亮【春意点睛】：娇嫩的柔和樱花粉，点亮整个键盘的灵魂
    key_back_color: 0xffFFFFFF          # 按键背景：纯白按键。在薄荷绿大背景的烘托下，极具现代 UI 崇尚的卡片悬浮感
    key_text_color: 0xff1E3A2F          # 按键主字母：高对比度的暗玉绿，字迹极其清晰，比死黑更显高级
    preview_back_color: 0xffFF9AA2      # 按键弹窗气泡：跟随柔美樱花粉
    preview_text_color: 0xffFFFFFF      # 按键弹窗文字：纯白

# =============================================================================
# 键盘面配置 (Keyboards Layout)
# =============================================================================
preset_keyboards:
  default:
    ascii_mode: 0
    name: "标准26键"
    author: "无"
    width: 10
    lock: true
    ascii_keyboard: letter
    height: *VJG
    horizontal_gap: *VJL
    vertical_gap: *VJH
    key_text_offset_y: *DtextY
    key_symbol_offset_y: *DsymY
    key_press_offset_x: 0
    key_press_offset_y: 8
    key_symbol_offset_x: *DsymX
    label_transform: uppercase
    keys:
      # 第一行
      - {click: q, swipe_up: 1}
      - {click: w, swipe_up: 2, swipe_down: "~"}
      - {click: e, swipe_up: 3, swipe_down: _Keyboard_Color}
      - {click: r, swipe_up: 4}
      - {click: t, swipe_up: 5, swipe_down: Tab, key_text_color: 0xff5F97F6}
      - {click: y, swipe_up: 6, swipe_down: _Keyboard_phrase, key_text_color: 0xff5F97F6}
      - {click: u, swipe_up: 7, swipe_down: csjb, swipe_left: "Ü", swipe_right: "ü"}
      - {click: i, swipe_up: 8, swipe_down: "|"}
      - {click: o, swipe_up: 9, swipe_down: "°", swipe_left: "Ö", swipe_right: "ö"}
      - {click: p, swipe_up: 0, swipe_down: "%"}
      # 第二行
      - {width: 5}
      - {click: a, swipe_up: "@", swipe_left: "Ä", swipe_right: "ä"}
      - {click: s, swipe_up: "$"}
      - {click: d, swipe_up: "=", swipe_down: "≠", swipe_right: '≤', swipe_left: '≥'}
      - {click: f, swipe_up: ";", swipe_down: "\\"}
      - {click: g, swipe_up: gpt1, swipe_down: gpt2, swipe_left: gpt3, swipe_right: gpt4, long_click: gpt5, key_text_color: 0xff5F97F6}
      - {click: h, swipe_up: "+", swipe_down: "#"}
      - {click: j, swipe_up: "-", swipe_down: "_"}
      - {click: k, swipe_up: '""{Left}', swipe_left: '".', swipe_right: '"', swipe_down: '"'}
      - {click: l, swipe_up: "''{Left}", swipe_down: "'", swipe_left: "'", swipe_right: "'"}
      # 第三行
      - {click: Shift_L, swipe_up: Settings, swipe_right: undo_Ch, composing: Escape, width: 14, key_text_size: 16}
      - {width: 1}
      - {click: z, swipe_up: "`", swipe_right: ':"', swipe_down: ':'}
      - {click: x, swipe_up: "^", swipe_down: "*"}
      - {click: c, swipe_up: copyH, swipe_down: copyA, swipe_left: copyL, swipe_right: copyR}
      - {click: v, swipe_up: paste, key_text_color: 0xff5F97F6}
      - {click: b, swipe_up: "/", swipe_down: "\\", swipe_left: "ẞ", swipe_right: "ß"}
      - {click: n, swipe_up: "[]{Left}", swipe_down: "&", swipe_left: "[", swipe_right: "]"}
      - {click: m, swipe_up: "(){Left}", swipe_down: "{}{Left}", swipe_left: "(", swipe_right: ")"}
      - {width: 1}
      - {click: BackSpace, swipe_left: ClearH_Ch, swipe_up: Clear, swipe_down: Escape, key_text_offset_y: 0, width: 14, key_text_size: 24}
      # 第四行
      - {height: *VJM, click: K_number, label: '?123', composing: delimiterD, key_symbol_offset_x: 0, swipe_up: Theme_settings2, swipe_down: Color_switch2, swipe_right: Menu, width: 16, key_text_size: 16}
      - {click: ",", label: " ，", key_symbol_offset_x: 0, composing: delimiterO, swipe_up: "!", swipe_down: ",", swipe_right: "<", width: 18, key_text_size: 16}
      - {click: space1, key_text_size: 18, key_text_offset_x: 0, key_text_offset_y: 0, key_symbol_offset_x: 0, key_symbol_offset_y: 6, swipe_left: Left, swipe_right: Right, swipe_up: Page_Up, swipe_down: Page_Down, key_text_color: 0xff5F97F6, width: 32}
      - {click: ".", label: " 。", key_symbol_offset_x: 0, composing: delimiterO, swipe_up: "?", swipe_down: ".", swipe_left: ">", width: 18, key_text_size: 16}
      - {click: Return, swipe_up: Baidu, swipe_down: Baidu, swipe_left: CommitComment, key_symbol_offset_x: 0, key_back_color: 0xff5F97F6, width: 16, key_text_size: 16}
      # 底部抬高行
      - {height: *DG, width: 100}

  letter:
    __include: /preset_keyboards/default
    __patch:
        "keys/@6/swipe_left": "Ü"
    ascii_mode: 1
